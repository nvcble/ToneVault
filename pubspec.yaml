name: tone_vault
description: "ToneVault - guitar pedal, configuration and rig manager."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # Local SQLite persistence. drift_flutter supplies the Android database file
  # location, so we don't depend on path_provider/path directly.
  drift: ^2.34.3
  drift_flutter: ^0.3.1

  # Pinned to 2.x: flutter_riverpod 3.x depends on package:test at runtime,
  # whose analyzer bounds cannot co-resolve with drift_dev 2.34 on this SDK.
  flutter_riverpod: ^2.6.1

  go_router: ^17.5.0

  # Getting a backup out of the app and one back in, without the app owning a
  # folder on the device or asking for storage permission.
  #
  # share_plus hands the finished file to the system share sheet, so the user
  # picks Drive, email or Files themselves; it writes the temporary file itself,
  # which is why path_provider is still not a direct dependency. It pulls
  # url_launcher in for its desktop fallback.
  # file_selector picks a backup back up, and reads it without a path.
  share_plus: ^13.3.0
  file_selector: ^1.1.0

  # A photo of the pedal itself.
  #
  # image_picker rather than file_selector, which is already here: a pedal is
  # photographed on the board more often than it is found in a folder, and only
  # image_picker offers the camera. It needs no Android permission of its own,
  # because it asks the system camera app for the shot.
  # path_provider says where the copy goes. It was already here transitively; the
  # photo is the first thing the app keeps in a file of its own.
  image_picker: ^1.2.0
  path_provider: ^2.1.6

  # Sound: the chords the ear training plays, and the metronome's click.
  #
  # Both are generated rather than recorded - the app builds a WAV in memory from
  # the notes the theory engine worked out - so there are no audio assets to ship
  # and any chord in any key can be played. audioplayers is only asked to play a
  # file, which is the one thing every platform it supports agrees on.
  audioplayers: ^6.5.1

  # MIDI transport for the multi-effects control module. Used only behind
  # `MidiTransport` in `core/midi/transports/` - nothing else in the app
  # imports this package directly, so it can be swapped without touching the
  # engine, the device profiles, or any screen.
  flutter_midi_command: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  drift_dev: ^2.34.5
flutter:
  uses-material-design: true

  assets:
    # The curriculum the Academy ships with, one file per learning path. Shipped as
    # data rather than written into Dart so a course can be corrected without a
    # code change, and read through the same importer a user's own file goes
    # through.
    - assets/curriculum/
